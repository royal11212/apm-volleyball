
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ВК «АПМ РФ» | Официальный сайт</title>
  
  <!-- Основные стили -->
  <link rel="stylesheet" href="style.css" />
  
  <!-- Шрифты Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Виджет Netlify Identity -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

  <!-- Шапка сайта -->
  <header class="header">
    <div class="container">
      <div class="logo">
        <h2>ВК «АПМ РФ»</h2>
      </div>
      <nav class="nav">
        <a href="#about">О команде</a>
        <a href="#roster">Состав</a>
        <a href="#matches">Матчи</a>
        <a href="#contact">Контакты</a>
      </nav>
    </div>
  </header>

  <!-- Блок "Матчи / Соперник" -->
  <section id="matches" class="section">
    <div class="container">
      <div class="match-card" style="text-align: center; margin-bottom: 40px;">
        <h2><strong>АПМ РФ</strong> <span style="color: #c59b27;">VS</span> Соперник</h2>
      </div>
    </div>
  </section>

  <!-- Секция формы с вашим интерфейсом и рабочей отправкой -->
  <section id="contact" class="section form-section">
    <div class="container">
      <div class="form-container">
        <h2>Хотите присоединиться или организовать товарняк?</h2>
        <p>Оставьте заявку, и мы свяжемся с вами</p>

        <!-- Форма обратной связи с поддержкой Netlify Forms -->
        <form name="contact" method="POST" data-netlify="true" id="ajaxForm">
          <!-- Обязательное скрытое поле для Netlify -->
          <input type="hidden" name="form-name" value="contact" />

          <div class="form-group">
            <input type="text" name="name" id="userName" placeholder="ivan" required />
          </div>

          <div class="form-group">
            <input type="text" name="contact" id="userContact" placeholder="@jfjjbyhuefb" required />
          </div>

          <div class="form-group">
            <select name="subject" id="userSubject" required>
              <option value="Товарищеский матч">Товарищеский матч</option>
              <option value="Вступление в команду">Вступление в команду</option>
              <option value="Сотрудничество / Спонсорство" selected>Сотрудничество / Спонсорство</option>
            </select>
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">Отправить заявку</button>
          
          <!-- Блок вывода статуса отправки -->
          <div id="formStatus" style="margin-top: 15px; font-weight: bold; text-align: center; display: none;"></div>
        </form>
      </div>
    </div>
  </section>

  <!-- Футер -->
  <footer class="footer">
    <div class="container" style="text-align: center; padding: 20px 0;">
      <p>© 2026 Волейбольный клуб «АПМ РФ». Все права защищены.</p>
    </div>
  </footer>

  <!-- Скрипт отправки без ошибок соединения -->
  <script>
    const form = document.getElementById('ajaxForm');
    const formStatus = document.getElementById('formStatus');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const formData = new FormData(form);

      try {
        const response = await fetch('/', {
          method: 'POST',
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams(formData).toString()
        });

        formStatus.style.display = 'block';

        if (response.ok) {
          formStatus.style.color = '#4CAF50';
          formStatus.innerText = '✓ Заявка успешно отправлена!';
          form.reset();
        } else {
          throw new Error('Ошибка сервера');
        }
      } catch (error) {
        formStatus.style.display = 'block';
        formStatus.style.color = '#ff4d4d';
        formStatus.innerText = '✕ Ошибка отправки. Попробуйте еще раз.';
      }
    });
  </script>

</body>
</html>

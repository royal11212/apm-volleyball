
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ВК «АПМ РФ» | Официальный сайт волейбольной команды</title>
  
  <!-- Подключение стилей -->
  <link rel="stylesheet" href="style.css" />
  
  <!-- Шрифты Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Виджет Netlify Identity -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

  <!-- Блок с заголовком и карточкой матча -->
  <header style="text-align: center; padding: 40px 20px 20px 20px;">
    <h1 style="font-size: 2.5rem; margin-bottom: 20px; font-weight: 800;">Волейбольный клуб «АПМ РФ»</h1>
    <div style="font-size: 1.8rem; font-weight: 700; margin-top: 10px;">
      <span>АПМ РФ</span> <span style="color: #c59b27; margin: 0 10px;">VS</span> <span>Соперник</span>
    </div>
  </header>

  <!-- Форма обратной связи в оригинальном стиле -->
  <main>
    <section class="form-container" style="max-width: 500px; margin: 30px auto; padding: 30px 20px; border-radius: 12px; background: rgba(255, 255, 255, 0.05); text-align: center;">
      <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 10px;">Хотите присоединиться или организовать товарняк?</h2>
      <p style="opacity: 0.8; margin-bottom: 25px;">Оставьте заявку, и мы свяжемся с вами</p>

      <!-- Рабочая форма с Netlify Forms -->
      <form name="contact" method="POST" data-netlify="true" id="appForm">
        <!-- Обязательное скрытое поле Netlify -->
        <input type="hidden" name="form-name" value="contact" />

        <div style="margin-bottom: 15px;">
          <input type="text" name="name" id="userName" placeholder="ivan" required style="width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #fff; color: #000; box-sizing: border-box; font-size: 1rem;" />
        </div>

        <div style="margin-bottom: 15px;">
          <input type="text" name="contact" id="userContact" placeholder="@jfjjbyhuefb" required style="width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #fff; color: #000; box-sizing: border-box; font-size: 1rem;" />
        </div>

        <div style="margin-bottom: 20px;">
          <select name="subject" id="userSubject" required style="width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #fff; color: #000; box-sizing: border-box; font-size: 1rem; cursor: pointer;">
            <option value="Товарищеский матч">Товарищеский матч</option>
            <option value="Вступление в команду">Вступление в команду</option>
            <option value="Сотрудничество / Спонсорство" selected>Сотрудничество / Спонсорство</option>
          </select>
        </div>

        <button type="submit" style="width: 100%; padding: 14px; background: #c59b27; border: none; border-radius: 6px; color: #000; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background 0.2s;" onmouseover="this.style.background='#d4a92c'" onmouseout="this.style.background='#c59b27'">Отправить заявку</button>
        
        <div id="formStatus" style="margin-top: 15px; font-weight: 700; display: none;"></div>
      </form>
    </section>
  </main>

  <!-- Футер -->
  <footer style="text-align: center; padding: 30px 10px; font-size: 0.85rem; opacity: 0.7;">
    <p>&copy; 2026 Волейбольный клуб «АПМ РФ». Все права защищены.</p>
  </footer>

  <!-- Скрипт отправки без ошибок API / CORS -->
  <script>
    const form = document.getElementById('appForm');
    const formStatus = document.getElementById('formStatus');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const formData = new FormData(form);

      try {
        const response = await fetch('/', {
          method: 'POST',
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams(formData).toString()
        });

        formStatus.style.display = 'block';

        if (response.ok) {
          formStatus.style.color = '#4CAF50';
          formStatus.innerText = '✓ Заявка успешно отправлена!';
          form.reset();
        } else {
          throw new Error('Ошибка при отправке');
        }
      } catch (error) {
        formStatus.style.display = 'block';
        formStatus.style.color = '#ff4d4d';
        formStatus.innerText = '✕ Ошибка отправки. Попробуйте еще раз.';
      }
    });
  </script>

</body>
</html>

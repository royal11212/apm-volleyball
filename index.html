
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ВК «АПМ РФ» | Официальный сайт волейбольной команды</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Виджет Netlify Identity для авторизации -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    /* Базовая стилизация формы, если нет style.css */
    body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
    .form-container { max-width: 500px; margin: 40px auto; padding: 20px; background: #1b261d; border-radius: 8px; text-align: center; }
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 14px; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #444; background: #fff; color: #000; box-sizing: border-box; }
    button.submit-btn { width: 100%; padding: 12px; background: #c59b27; border: none; border-radius: 4px; color: #000; font-weight: bold; cursor: pointer; }
    button.submit-btn:hover { background: #d4a92c; }
  </style>
</head>
<body>

  <header style="text-align: center;">
    <h1>Волейбольный клуб «АПМ РФ»</h1>
  </header>

  <main>
    <section class="form-container">
      <h2>Хотите присоединиться или организовать товарняк?</h2>
      <p>Оставьте заявку, и мы свяжемся с вами</p>

      <!-- Форма с интеграцией Netlify Forms (data-netlify="true") -->
      <form name="contact" method="POST" data-netlify="true">
        <!-- Обязательное скрытое поле для Netlify -->
        <input type="hidden" name="form-name" value="contact" />

        <div class="form-group">
          <input type="text" name="name" placeholder="Ваше имя" required />
        </div>

        <div class="form-group">
          <input type="text" name="contact" placeholder="@telegram / телефон" required />
        </div>

        <div class="form-group">
          <select name="subject" required>
            <option value="Товарищеский матч">Товарищеский матч</option>
            <option value="Вступление в команду">Вступление в команду</option>
            <option value="Сотрудничество / Спонсорство" selected>Сотрудничество / Спонсорство</option>
          </select>
        </div>

        <button type="submit" class="submit-btn">Отправить заявку</button>
      </form>
    </section>
  </main>

  <footer style="text-align: center; margin-top: 40px; font-size: 12px; opacity: 0.7;">
    <p>&copy; 2026 Волейбольный клуб «АПМ РФ». Все права защищены.</p>
  </footer>

</body>
</html>
